included:
  - Sources
  - Tests

excluded:
  - .build
  - docs

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - sorted_imports

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 700
